services:
  server:
    build:
      context: .
      dockerfile: dev.Dockerfile
    image: todo-back-dev
    container_name: todo-back-dev
    volumes:
      - ./:/usr/src/app
    ports:
      - 3000:3000
    environment:
      - REDIS_URL=redis://redis:6379
      - MONGO_URL=mongodb://teppo:salainen@mongo:27017/todo_db
    depends_on:
      - mongo
      - redis
  mongo:
    image: mongo
    ports:
      - 3456:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: teppo
      MONGO_INITDB_ROOT_PASSWORD: salainen
      MONGO_INITDB_DATABASE: todo_db
    volumes:
      - ./mongo/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js
      - mongo_data:/data/db
  redis:
    image: redis
    ports:
      - 6379:6379
    command: ['redis-server', '--appendonly', 'yes'] # Overwrite the CMD
    volumes: # Declare the volume
      - ./redis_data:/data

volumes:
  mongo_data:
  redis_data:
